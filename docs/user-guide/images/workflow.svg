<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 616" width="760" height="616" role="img" aria-labelledby="wf-title">
<title id="wf-title">Eight steps take a tournament from Draft to Completed</title>
<style>
  svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 13px; }
  .bg { fill: #ffffff; }
  .t1 { fill: #1f2328; font-weight: 600; }
  .t2 { fill: #59636e; font-size: 11.5px; }
  .h { font-weight: 600; letter-spacing: 0.04em; }
  .line { fill: none; stroke: #c4c1b7; stroke-width: 1.25; }
  .tint { fill: #efeeea; }
  .head { fill: #a19e94; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .t1 { fill: #e6edf3; }
    .t2 { fill: #9198a1; }
    .line { stroke: #4b535d; }
    .tint { fill: #1c2128; }
    .head { fill: #6e7681; }
  }
</style>
<defs><marker id="wf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="760" height="616" rx="12"/>
<text class="t1" x="24" y="34" style="font-size: 15px">Eight steps take a tournament from Draft to Completed</text>
<text class="t2" x="24" y="56">Each step, who does it and where; on the right, the stage its Dashboard shows when the step is done</text>
<text class="t2 h" x="24" y="82">STEP</text>
<text class="t2 h" x="504" y="82">TOURNAMENT STAGE</text>
<g class="line">
  <path d="M244 144V160" marker-end="url(#wf-arrow)"/>
  <path d="M244 208V224" marker-end="url(#wf-arrow)"/>
  <path d="M244 272V288" marker-end="url(#wf-arrow)"/>
  <path d="M244 336V352" marker-end="url(#wf-arrow)"/>
  <path d="M244 400V416" marker-end="url(#wf-arrow)"/>
  <path d="M244 464V480" marker-end="url(#wf-arrow)"/>
  <path d="M244 528V544" marker-end="url(#wf-arrow)"/>
  <path d="M464 120H504" marker-end="url(#wf-arrow)"/>
  <path d="M464 184H504" marker-end="url(#wf-arrow)"/>
  <path d="M464 248H504" marker-end="url(#wf-arrow)"/>
  <path d="M464 312H504" marker-end="url(#wf-arrow)"/>
  <path d="M464 376H504" marker-end="url(#wf-arrow)"/>
  <path d="M464 440H504" marker-end="url(#wf-arrow)"/>
  <path d="M464 504H504" marker-end="url(#wf-arrow)"/>
  <path d="M464 568H504" marker-end="url(#wf-arrow)"/>
</g>
<rect class="line" x="24" y="96" width="440" height="48" rx="8"/>
<text class="t1" x="40" y="116" xml:space="preserve">1  Create the tournament</text>
<text class="t2" x="40" y="134">Admin · Tournaments, then the Settings tab</text>
<rect class="line" x="24" y="160" width="440" height="48" rx="8"/>
<text class="t1" x="40" y="180" xml:space="preserve">2  Set up categories</text>
<text class="t2" x="40" y="198">Admin · Categories: age groups, weight classes</text>
<rect class="line" x="24" y="224" width="440" height="48" rx="8"/>
<text class="t1" x="40" y="244" xml:space="preserve">3  Take registrations</text>
<text class="t2" x="40" y="262">Coaches by link, registration officer, admin</text>
<rect class="line" x="24" y="288" width="440" height="48" rx="8"/>
<text class="t1" x="40" y="308" xml:space="preserve">4  Weigh in Kumite players</text>
<text class="t2" x="40" y="326">Weigh-in officer · Weigh-in tab</text>
<rect class="line" x="24" y="352" width="440" height="48" rx="8"/>
<text class="t1" x="40" y="372" xml:space="preserve">5  Lock entries and draw</text>
<text class="t2" x="40" y="390">Admin · Dashboard locks, Draw / Pools, Bracket</text>
<rect class="line" x="24" y="416" width="440" height="48" rx="8"/>
<text class="t1" x="40" y="436" xml:space="preserve">6  Schedule the matches</text>
<text class="t2" x="40" y="454">Admin · Matches: mat, time, referee, judges</text>
<rect class="line" x="24" y="480" width="440" height="48" rx="8"/>
<text class="t1" x="40" y="500" xml:space="preserve">7  Run the competition day</text>
<text class="t2" x="40" y="518">Announcer, referees, judges, scoreboard operator</text>
<rect class="line" x="24" y="544" width="440" height="48" rx="8"/>
<text class="t1" x="40" y="564" xml:space="preserve">8  Publish the results</text>
<text class="t2" x="40" y="582">Admin · Results, Certificates, Reports</text>
<rect class="tint" x="504" y="96" width="232" height="112" rx="8"/>
<rect class="line" x="504" y="96" width="232" height="112" rx="8"/>
<text class="t1" x="620" y="156.5" text-anchor="middle">Draft</text>
<rect class="tint" x="504" y="224" width="232" height="48" rx="8"/>
<rect class="line" x="504" y="224" width="232" height="48" rx="8"/>
<text class="t1" x="620" y="245" text-anchor="middle">Registration open</text>
<text class="t2" x="620" y="261" text-anchor="middle">then Registration closed</text>
<rect class="tint" x="504" y="288" width="232" height="48" rx="8"/>
<rect class="line" x="504" y="288" width="232" height="48" rx="8"/>
<text class="t1" x="620" y="316.5" text-anchor="middle">Weigh-in</text>
<rect class="tint" x="504" y="352" width="232" height="48" rx="8"/>
<rect class="line" x="504" y="352" width="232" height="48" rx="8"/>
<text class="t1" x="620" y="373" text-anchor="middle">Entries locked</text>
<text class="t2" x="620" y="389" text-anchor="middle">then Draw generated</text>
<rect class="tint" x="504" y="416" width="232" height="48" rx="8"/>
<rect class="line" x="504" y="416" width="232" height="48" rx="8"/>
<text class="t1" x="620" y="444.5" text-anchor="middle">Ready (optional)</text>
<rect class="tint" x="504" y="480" width="232" height="48" rx="8"/>
<rect class="line" x="504" y="480" width="232" height="48" rx="8"/>
<text class="t1" x="620" y="508.5" text-anchor="middle">Live</text>
<rect class="tint" x="504" y="544" width="232" height="48" rx="8"/>
<rect class="line" x="504" y="544" width="232" height="48" rx="8"/>
<text class="t1" x="620" y="565" text-anchor="middle">Completed</text>
<text class="t2" x="620" y="581" text-anchor="middle">then Archived</text>
</svg>
